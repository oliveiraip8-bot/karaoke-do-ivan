name: Publish Karaokê do Ivan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir _site
          unzip -q Karaoke_do_Ivan_3_colunas_PWA.zip -d _site
          cp icon.svg _site/icon.svg
          cp favorites.js _site/favorites.js
          cp recents.js _site/recents.js
          cp focus.js _site/focus.js
          printf '\n<script src="favorites.js"></script>\n<script src="recents.js"></script>\n<script src="focus.js"></script>\n' >> _site/index.html
          find _site -maxdepth 2 -type f -print
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
